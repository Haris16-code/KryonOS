; =========================================================================
; ENVIRONMENT: LilyGO T-Deck / T-Deck Plus
; ESP32-S3 (16MB Flash, 8MB Octal PSRAM) + 2.8" ST7789 SPI LCD (320x240)
; + ESP32-C3 QWERTY Keyboard (I2C) + Goodix GT911 Capacitive Touch
; + 5-Way Trackball + MicroSD SPI Slot + Battery ADC
; =========================================================================

[env:lilygo-t-deck]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
monitor_speed = 115200

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson @ 7.1.0
    mathieucarbou/ESPAsyncWebServer @ 3.1.5
    links2004/WebSockets @ ^2.4.1
    bodmer/TJpg_Decoder @ ^1.1.0
    bitbank2/PNGdec @ ^1.0.2

build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D TARGET_T_DECK=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_LOOP_STACK_SIZE=16384

    ; --- Display Dimensions ---
    -D DISP_HOR_RES=320
    -D DISP_VER_RES=240

    ; --- TFT_eSPI Configuration Guard & Driver ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=0
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; --- ST7789 SPI Pinout ---
    -D TFT_MOSI=41
    -D TFT_MISO=38
    -D TFT_SCLK=40
    -D TFT_CS=12
    -D TFT_DC=11
    -D TFT_RST=-1
    -D TFT_BL=42
    -D TFT_BACKLIGHT_ON=HIGH

    ; --- SPI Speeds ---
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1

