; =========================================================================
; ENVIRONMENT: LilyGO T-HMI (ESP32-S3 + ST7789 8-bit Parallel + XPT2046 Touch)
; =========================================================================

[env:lilygo-t-hmi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
monitor_speed = 115200

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson @ 7.1.0
    mathieucarbou/ESPAsyncWebServer @ 3.1.5
    links2004/WebSockets @ ^2.4.1

build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D TARGET_T_HMI=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_LOOP_STACK_SIZE=32768

    ; --- TFT_eSPI Configuration Guard & Parallel Driver ---
    -D USER_SETUP_LOADED=1
    -D USER_SETUP_ID=207
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D TFT_PARALLEL_8_BIT=1

    ; --- Display Control Pins ---
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=-1
    -D TFT_WR=8
    -D TFT_RD=-1
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=HIGH

    ; --- 8-bit Parallel Data Bus ---
    -D TFT_D0=48
    -D TFT_D1=47
    -D TFT_D2=39
    -D TFT_D3=40
    -D TFT_D4=41
    -D TFT_D5=42
    -D TFT_D6=45
    -D TFT_D7=46

    ; --- Touch Screen Pins (XPT2046) ---
    -D TOUCHSCREEN_SCLK_PIN=1
    -D TOUCHSCREEN_MISO_PIN=4
    -D TOUCHSCREEN_MOSI_PIN=3
    -D TOUCHSCREEN_CS_PIN=2
    -D TOUCHSCREEN_IRQ_PIN=9

    ; --- Power & Battery ADC Pins ---
    -D PWR_EN_PIN=10
    -D PWR_ON_PIN=14
    -D BAT_ADC_PIN=5

    ; --- SD_MMC Pins ---
    -D SD_SCLK_PIN=12
    -D SD_MOSI_PIN=11
    -D SD_MISO_PIN=13

    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1