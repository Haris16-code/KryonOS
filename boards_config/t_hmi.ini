; =========================================================================
; AMBIENTE: LilyGO T-HMI (ESP32-S3 + ST7789 Paralelo 8-bit)
; =========================================================================
[env:HMI]
board = esp32-s3-devkitc-1
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
build_type = debug

lib_deps =
    ${env.lib_deps}
    https://github.com/liangyingy/arduino_xpt2046_library.git

build_src_filter = +<*> -<boards/> +<boards/t_hmi/>
build_flags =
    ${env.build_flags}
    -D TARGET_T_HMI=1
    
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D ENABLE_MEM_OVERLAY

; --- Override do TFT_eSPI ---
    -D USER_SETUP_ID=207
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D TFT_PARALLEL_8_BIT=1

    ; --- Pinos de Controle do Display ---
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=-1
    -D TFT_WR=8
    -D TFT_RD=-1

    ; --- Barramento Paralelo de Dados (8-bit) ---
    -D TFT_D0=48
    -D TFT_D1=47
    -D TFT_D2=39
    -D TFT_D3=40
    -D TFT_D4=41
    -D TFT_D5=42
    -D TFT_D6=45
    -D TFT_D7=46