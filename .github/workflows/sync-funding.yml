name: Sync Funding

on:
  schedule:
    - cron: "*/30 * * * *" # Runs every 30 minutes
  workflow_dispatch:       # Manual trigger in GitHub Actions tab
  repository_dispatch:     # Optional webhook trigger
    types: [lemon_squeezy_order]
  push:
    branches:
      - main
    paths:
      - "README.md"        # Immediately recalculates if you edit Goal-$XXX in README

permissions:
  contents: write

jobs:
  sync-funding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README and generate SVG
        env:
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_PRODUCT_ID: ${{ secrets.LEMONSQUEEZY_PRODUCT_ID }}
        run: python .github/workflow/funding/sync_funding.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflow/funding/progress.svg
          if git diff --staged --quiet; then
            echo "No funding changes detected."
          else
            git commit -m "chore(funding): sync funding progress [skip ci]"
            git push
          fi
