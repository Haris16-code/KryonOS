name: Sync Funding

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [patreon_webhook, patreon_pledge]
  push:
    branches:
      - main
    paths:
      - "README.md"

permissions:
  contents: write

jobs:
  sync-funding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README and generate SVG
        env:
          PATREON_ACCESS_TOKEN: ${{ secrets.PATREON_ACCESS_TOKEN }}
          PATREON_CAMPAIGN_ID: ${{ secrets.PATREON_CAMPAIGN_ID }}
        run: python .github/funding/sync_funding.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/funding/progress.svg
          if git diff --staged --quiet; then
            echo "No funding changes detected."
          else
            git commit -m "chore(funding): sync funding progress [skip ci]"
            git push
          fi
