name: Sync Announcements

on:
  discussion:
    types: [created]

jobs:
  draft_ghost_post:
    if: github.event.discussion.category.name == 'Announcements'
    runs-on: ubuntu-latest

    steps:
      - name: Create Draft Post in Ghost CMS
        env:
          GHOST_URL: ${{ secrets.GHOST_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          TITLE: ${{ github.event.discussion.title }}
          BODY_MD: ${{ github.event.discussion.body }}
          URL: ${{ github.event.discussion.html_url }}
        run: |
          npm install --no-save marked jsonwebtoken
          node -e '
            const jwt = require("jsonwebtoken");
            const { marked } = require("marked");

            async function createGhostDraft() {
              const apiUrl = process.env.GHOST_URL.replace(/\/$/, "");
              const apiKey = process.env.GHOST_ADMIN_API_KEY;
              const title = process.env.TITLE;
              const rawMarkdown = process.env.BODY_MD || "";
              const discussionUrl = process.env.URL;

              // 1. Sign short-lived JWT from Ghost Admin API Key (id:secret)
              const [id, secret] = apiKey.split(":");
              const token = jwt.sign({}, Buffer.from(secret, "hex"), {
                keyid: id,
                algorithm: "HS256",
                expiresIn: "5m",
                audience: "/admin/"
              });

              // 2. Convert GitHub Markdown to HTML and prepend source link
              const parsedHtml = marked.parse(rawMarkdown, { gfm: true });
              const finalHtml = `<p><em>Originally posted on <a href="${discussionUrl}">GitHub Discussions</a></em></p><hr>${parsedHtml}`;

              // 3. Create draft post via Ghost Admin API
              const response = await fetch(`${apiUrl}/ghost/api/admin/posts/?source=html`, {
                method: "POST",
                headers: {
                  "Authorization": `Ghost ${token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  posts: [
                    {
                      title: title,
                      html: finalHtml,
                      status: "draft",
                      tags: [{ name: "Announcements" }]
                    }
                  ]
                })
              });

              const data = await response.json();
              if (!response.ok) {
                console.error("Failed to create Ghost draft:", JSON.stringify(data, null, 2));
                process.exit(1);
              }

              console.log(`Ghost draft created: ${data.posts[0].id}`);
            }

            createGhostDraft();
          '
