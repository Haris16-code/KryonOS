name: Build & Draft KryonOS Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v2.0.1)'
        required: true
        type: string
        default: 'v2.0.1'
      release_title:
        description: 'Release Title'
        required: true
        type: string
        default: 'KryonOS v2.0.1'
      clean_cache:
        description: 'Force clean build before compiling?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # JOB 1: Verify Release Tag Does Not Already Exist (Fails Fast in ~3s)
  # =========================================================================
  validate-tag:
    name: Check Release Tag (${{ inputs.tag_name }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Verify Tag & Release Availability
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          # 1. Check if any Published or Draft Release already uses this tag
          EXISTING_RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] \vert{} select(.tag_name == \"${TAG}\") | .tag_name" || true)
          if [ -n "$EXISTING_RELEASE" ]; then
            echo "::error title=Release Tag Already Exists::The release tag '${TAG}' already exists (as a Published or Draft release). Please change the tag_name input before running this workflow."
            exit 1
          fi

          # 2. Check if the Git tag already exists in the repository
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=Git Tag Already Exists::The Git tag '${TAG}' already exists in the repository. Please enter a new version tag before running this workflow."
            exit 1
          fi

          echo "Tag '${TAG}' is available. Proceeding to compile boards..."

  # =========================================================================
  # JOB 2: Compile All 5 Boards Simultaneously (Only Runs if Tag is New)
  # =========================================================================
  build:
    name: Compile ${{ matrix.board }}
    needs: validate-tag
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32-s3-devkitc-1-n16r8
          - lilygo-t-hmi
          - m5stack-cardputer
          - esp32-cyd-28
          - esp32doit-devkit-v1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Pip & PlatformIO Toolchains
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.board }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.board }}-${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Compile Board Target
        env:
          CLEAN: ${{ inputs.clean_cache }}
          BOARD_ENV: ${{ matrix.board }}
        run: |
          if [ "$CLEAN" = "true" ]; then
            pio run -t clean -e "$BOARD_ENV"
          fi
          pio run -e "$BOARD_ENV"

      - name: Package Binaries & Compute SHA-256
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
          BOARD_ENV: ${{ matrix.board }}
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/${BOARD_ENV}"
          mkdir -p out

          case "${BOARD_ENV}" in
            esp32-cyd-28|esp32doit-devkit-v1)
              BOOT_OFFSET="0x1000"
              ;;
            *)
              BOOT_OFFSET="0x0000"
              ;;
          esac

          APP_FILE="KryonOS-${TAG}-${BOARD_ENV}-firmware-0x10000.bin"
          PART_FILE="KryonOS-${TAG}-${BOARD_ENV}-partitions-0x8000.bin"
          BOOT_FILE="KryonOS-${TAG}-${BOARD_ENV}-bootloader-${BOOT_OFFSET}.bin"

          cp "${BUILD_DIR}/firmware.bin" "out/${APP_FILE}"
          cp "${BUILD_DIR}/partitions.bin" "out/${PART_FILE}"
          cp "${BUILD_DIR}/bootloader.bin" "out/${BOOT_FILE}"

          APP_HASH=$(sha256sum "out/${APP_FILE}" | awk '{print $1}')
          PART_HASH=$(sha256sum "out/${PART_FILE}" | awk '{print $1}')
          BOOT_HASH=$(sha256sum "out/${BOOT_FILE}" | awk '{print $1}')

          {
            echo "| **${BOARD_ENV}** | \`${BOOT_FILE}\` | \`${BOOT_OFFSET}\` | Bootloader | \`${BOOT_HASH}\` |"
            echo "| **${BOARD_ENV}** | \`${PART_FILE}\` | \`0x8000\` | Partition Table | \`${PART_HASH}\` |"
            echo "| **${BOARD_ENV}** | \`${APP_FILE}\` | \`0x10000\` | Firmware (App) | \`${APP_HASH}\` |"
          } > "out/${BOARD_ENV}.row"

      - name: Upload Board Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.board }}
          path: out/*
          retention-days: 1

  # =========================================================================
  # JOB 3: Assemble Flashing Table & Create Unpublished Draft Release
  # =========================================================================
  draft-release:
    name: Create GitHub Draft Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download All Compiled Board Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_files
          merge-multiple: true

      - name: Generate Markdown Release Notes & Create Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
          TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          NOTES="draft_notes.md"

          {
            echo "## Release Highlights"
            echo "<!-- Replace this comment with your release notes, features, and changelog before clicking Publish -->"
            echo ""
            echo "### Firmware Binaries & Flash Offsets"
            echo "| Board Target | File Name | Flash Offset | Role | SHA-256 Checksum |"
            echo "| :--- | :--- | :--- | :--- | :--- |"
            for f in release_files/*.row; do
              cat "$f"
            done
          } > "$NOTES"

          rm -f release_files/*.row

          gh release create "$TAG" release_files/*.bin \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --draft
