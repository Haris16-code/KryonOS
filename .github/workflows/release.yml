name: Build & Draft KryonOS Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v2.0.1)'
        required: true
        type: string
        default: 'v2.0.1'
      release_title:
        description: 'Release Title'
        required: true
        type: string
        default: 'KryonOS v2.0.1'
      clean_cache:
        description: 'Force clean build before compiling?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Compile ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32-s3-devkitc-1-n16r8
          - lilygo-t-hmi
          - m5stack-cardputer
          - esp32-cyd-28
          - esp32doit-devkit-v1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Pip & PlatformIO Toolchains
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.board }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.board }}-${{ runner.os }}-pio-

      - name: Install PlatformIO & Esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Compile Board Target
        env:
          CLEAN: ${{ inputs.clean_cache }}
          BOARD_ENV: ${{ matrix.board }}
        run: |
          if [ "$CLEAN" = "true" ]; then
            pio run -t clean -e "$BOARD_ENV"
          fi
          pio run -e "$BOARD_ENV"

      - name: Package Binaries, Merge Factory Image & Compute SHA-256
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
          BOARD_ENV: ${{ matrix.board }}
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/${BOARD_ENV}"
          mkdir -p out

          case "${BOARD_ENV}" in
            esp32-cyd-28|esp32doit-devkit-v1)
              CHIP="esp32"
              BOOT_OFFSET="0x1000"
              ;;
            *)
              CHIP="esp32s3"
              BOOT_OFFSET="0x0000"
              ;;
          esac

          FACTORY_FILE="KryonOS-${TAG}-${BOARD_ENV}-factory-0x0000.bin"
          APP_FILE="KryonOS-${TAG}-${BOARD_ENV}-firmware-0x10000.bin"
          PART_FILE="KryonOS-${TAG}-${BOARD_ENV}-partitions-0x8000.bin"
          BOOT_FILE="KryonOS-${TAG}-${BOARD_ENV}-bootloader-${BOOT_OFFSET}.bin"

          cp "${BUILD_DIR}/firmware.bin" "out/${APP_FILE}"
          cp "${BUILD_DIR}/partitions.bin" "out/${PART_FILE}"
          cp "${BUILD_DIR}/bootloader.bin" "out/${BOOT_FILE}"

          python3 -m esptool --chip "${CHIP}" merge_bin \
            -o "out/${FACTORY_FILE}" \
            "${BOOT_OFFSET}" "out/${BOOT_FILE}" \
            0x8000 "out/${PART_FILE}" \
            0x10000 "out/${APP_FILE}"

          FACTORY_HASH=$(sha256sum "out/${FACTORY_FILE}" | awk '{print $1}')
          APP_HASH=$(sha256sum "out/${APP_FILE}" | awk '{print $1}')
          PART_HASH=$(sha256sum "out/${PART_FILE}" | awk '{print $1}')
          BOOT_HASH=$(sha256sum "out/${BOOT_FILE}" | awk '{print $1}')

          echo "| **${BOARD_ENV}** | \`${FACTORY_FILE}\` | \`0x0000\` | \`${FACTORY_HASH}\` |" > "out/${BOARD_ENV}.factory_row"

          {
            echo "| **${BOARD_ENV}** | \`${APP_FILE}\` | \`0x10000\` | Application (OTA) | \`${APP_HASH}\` |"
            echo "| **${BOARD_ENV}** | \`${PART_FILE}\` | \`0x8000\` | Partition Table | \`${PART_HASH}\` |"
            echo "| **${BOARD_ENV}** | \`${BOOT_FILE}\` | \`${BOOT_OFFSET}\` | Bootloader | \`${BOOT_HASH}\` |"
          } > "out/${BOARD_ENV}.component_row"

      - name: Upload Board Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.board }}
          path: out/*
          retention-days: 1

  draft-release:
    name: Create GitHub Draft Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download All Compiled Board Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_files
          merge-multiple: true

      - name: Generate Markdown Release Notes & Create Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
          TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          NOTES="draft_notes.md"

          {
            echo "## Release Highlights"
            echo "<!-- Replace this comment with your release notes, features, and changelog before clicking Publish -->"
            echo ""
            echo "### Recommended: All-in-One Factory Images (\`0x0000\`)"
            echo "Flash the single factory binary for your board starting at address \`0x0000\`:"
            echo ""
            echo "| Board Target | Factory Binary File | Flash Offset | SHA-256 Checksum |"
            echo "| :--- | :--- | :--- | :--- |"
            for f in release_files/*.factory_row; do
              cat "$f"
            done
            echo ""
            echo "---"
            echo "### Individual Component Binaries & Offsets"
            echo "For manual segment flashing or OTA firmware updates:"
            echo ""
            echo "| Board Target | File Name | Flash Offset | Role | SHA-256 Checksum |"
            echo "| :--- | :--- | :--- | :--- | :--- |"
            for f in release_files/*.component_row; do
              cat "$f"
            done
          } > "$NOTES"

          rm -f release_files/*.factory_row release_files/*.component_row

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_files/*.bin --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --draft
          else
            gh release create "$TAG" release_files/*.bin \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --draft
          fi
